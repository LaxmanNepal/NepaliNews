<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"></meta>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"></meta>
    <title>Nepal News Hub | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"></link>
    <style>
        :root {
            --primary: #e11d48;
            --bg: #f8fafc;
            --nav-height: 70px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: #0f172a;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            padding-bottom: var(--nav-height);
            box-shadow: 0 0 50px rgba(0,0,0,0.05);
            position: relative;
        }

        .nav-item.active { color: var(--primary); }
        .nav-item.active svg { transform: translateY(-4px); color: var(--primary); }

        .category-pill {
            flex-shrink: 0;
            padding: 8px 18px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #f1f5f9;
            background: #f8fafc;
            color: #64748b;
            white-space: nowrap;
        }
        .category-pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
            transform: scale(1.05);
        }

        .reels-container {
            height: calc(100vh - var(--nav-height));
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .reels-container::-webkit-scrollbar { display: none; }
        .reel-card {
            height: 100%;
            scroll-snap-align: start;
            position: relative;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeIn 0.4s ease-out forwards; }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #f1f5f9;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .source-grid-item {
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            border-radius: 1.5rem;
            padding: 1rem;
            text-align: center;
            transition: all 0.2s;
            border: 1px solid #f1f5f9;
        }

        /* Toggle Switch Styling */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #e11d48;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #e11d48;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-100 px-5 py-3 flex flex-col gap-2" id="app-header">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2" id="brand-area">
                    <div class="w-7 h-7 bg-rose-600 rounded-lg flex items-center justify-center">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
                    </div>
                    <span class="font-extrabold text-lg tracking-tight">Nepal<span class="text-rose-600">Hub</span></span>
                </div>
                
                <div class="flex items-center gap-3">
                    <!-- Thumbnail Toggle -->
                    <div class="flex items-center gap-2 mr-1" id="thumb-toggle-area">
                        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-tighter">Images</span>
                        <div class="relative inline-block w-8 align-middle select-none transition duration-200 ease-in">
                            <input type="checkbox" name="toggle" id="thumb-toggle" class="toggle-checkbox absolute block w-4 h-4 rounded-full bg-white border-4 appearance-none cursor-pointer outline-none transition-all duration-300 left-0 border-slate-200"/>
                            <label for="thumb-toggle" class="toggle-label block overflow-hidden h-4 rounded-full bg-slate-200 cursor-pointer transition-colors duration-300"></label>
                        </div>
                    </div>

                    <div class="hidden" id="search-container">
                        <input class="w-full px-4 py-1.5 bg-slate-100 rounded-full text-xs outline-none border border-transparent focus:border-rose-200" id="search-input" placeholder="Search news..." type="text" />
                    </div>
                    <button class="p-2 text-slate-500 hover:text-rose-600 transition-colors" id="search-toggle">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                    </button>
                    <div class="text-[9px] font-bold bg-slate-100 px-2 py-1 rounded-full text-slate-500 whitespace-nowrap" id="header-count">
                        0 News
                    </div>
                </div>
            </div>
            
            <div class="flex items-center justify-between border-t border-slate-50 pt-2">
                <div class="flex items-center gap-1.5 text-slate-500">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                    <span class="text-[10px] font-bold uppercase tracking-wider" id="current-date">Loading...</span>
                </div>
                <div class="flex items-center gap-1.5 text-rose-600">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                    <span class="text-[10px] font-bold uppercase tracking-wider" id="current-time">00:00:00</span>
                </div>
            </div>
        </header>

        <!-- Category Scroll Bar -->
        <div class="sticky top-[95px] z-40 bg-white/80 backdrop-blur-md px-4 py-3 flex gap-2 overflow-x-auto no-scrollbar border-b border-slate-50" id="category-bar">
            <button class="category-pill active" id="cat-all" onclick="setCategory('all')">All News</button>
            <button class="category-pill" id="cat-sports" onclick="setCategory('sports')">Sports</button>
            <button class="category-pill" id="cat-finance" onclick="setCategory('finance')">Finance</button>
            <button class="category-pill" id="cat-tech" onclick="setCategory('tech')">Tech</button>
            <button class="category-pill" id="cat-entertainment" onclick="setCategory('entertainment')">Entertainment</button>
        </div>

        <!-- Content -->
        <main class="min-h-screen" id="content-area">
            <!-- Content injected via JS -->
        </main>

        <!-- Infinite Scroll Anchor -->
        <div class="h-24 flex items-center justify-center" id="infinite-anchor">
            <div class="spinner"></div>
        </div>

        <!-- Back to Top -->
        <button class="fixed bottom-24 right-5 z-[90] w-12 h-12 bg-rose-600 text-white rounded-full shadow-lg hidden items-center justify-center active:scale-90 transition-transform" id="back-to-top" onclick="scrollToTop()">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M5 15l7-7 7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>
        </button>

        <!-- Navigation -->
        <nav class="fixed bottom-0 left-0 right-0 z-[100] bg-white border-t border-slate-100 flex items-center justify-around h-[70px] max-w-[500px] mx-auto px-2">
            <button class="nav-item active flex flex-col items-center gap-1" id="nav-home" onclick="switchTab('home')">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                <span class="text-[10px] font-bold uppercase tracking-widest">Home</span>
            </button>
            <button class="nav-item flex flex-col items-center gap-1" id="nav-reels" onclick="switchTab('reels')">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></path></svg>
                <span class="text-[10px] font-bold uppercase tracking-widest">Reels</span>
            </button>
            <button class="nav-item flex flex-col items-center gap-1" id="nav-sources" onclick="switchTab('sources')">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                <span class="text-[10px] font-bold uppercase tracking-widest">Sources</span>
            </button>
            <button class="nav-item flex flex-col items-center gap-1" id="nav-notifications" onclick="switchTab('notifications')">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                <span class="text-[10px] font-bold uppercase tracking-widest">Alerts</span>
            </button>
        </nav>
    </div>

    <script>
        const RSS_PROXY = "https://api.rss2json.com/v1/api.json?rss_url=";
        const CACHE_KEY = "nepal_hub_pro_v4_cache";
        const THUMB_PREF_KEY = "nepal_hub_thumb_visible";

        const MASTER_FEEDS = {
            all: [
                "https://www.onlinekhabar.com/feed", "https://nagariknetwork.com/feed/", "https://ratopati.com/feed",
                "https://www.setopati.com/feed", "https://gorkhapatraonline.com/rss", "http://feeds.bbci.co.uk/nepali/rss.xml",
                "https://www.annapurnapost.com/rss", "https://rajdhanidaily.com/feed/", "https://ujyaaloonline.com/rss",
                "https://www.news24nepal.com/feed", "https://nepallive.com/feed", "https://myrepublica.nagariknetwork.com/feeds",
                "https://www.lokaantar.com/feed", "https://dainiknepal.com/feed", "https://nepalsamaya.com/feed",
                "https://pahilopost.com/feed", "https://nepalheadlines.com/feed", "https://nepalpress.com/feed/",
                "https://himalKhabar.com/feed", "https://nepalnews.com/feed/"
            ],
            sports: [
                "https://www.hamrokhelkud.com/feed", "https://www.goalnepal.com/rss", "https://www.khelpati.com/feed",
                "https://nepalsportz.com/feed/", "https://www.cricnepal.com/feed", "https://www.onlinekhabar.com/content/sports/feed",
                "https://www.newsofnepal.com/category/sports/feed/", "https://cricketnepal.org.np/feed/"
            ],
            finance: [
                "https://nepalnews.com/feed/", "https://www.sharesansar.com/rss", "https://www.abhiyandaily.com/rss/",
                "https://clickmandu.com/feed", "https://arthasarokar.com/feed", "https://bankingkhabar.com/feed",
                "https://www.vikasnews.com/feed", "https://www.aarthiknews.com/rss/", "https://www.onlinekhabar.com/content/business/feed"
            ],
            tech: [
                "https://www.techpana.com/feed", "https://www.nepalitelecom.com/feed", "https://techmandu.com/feed",
                "https://ictframe.com/feed", "https://techsathi.com/feed", "https://clicknepal.com/category/technology/feed",
                "https://www.onlinekhabar.com/content/technology/feed"
            ],
            entertainment: [
                "https://www.merofilm.com/feed", "https://www.lensnepal.com/feed", "http://www.filmykhabar.com/feed",
                "https://www.dcnepal.com/category/entertainment/feed", "https://lexlimbu.com/feed",
                "https://newsofnepal.com/category/entertainment/feed/", "https://english.khabarhub.com/category/entertainment/feed/",
                "https://www.onlinekhabar.com/content/entertainment/feed"
            ]
        };

        let allNews = [];
        let currentTab = 'home';
        let activeCategory = 'all';
        let itemsToShow = 10;
        let isBatchLoading = false;
        let searchQuery = "";
        
        // Thumbnail state (default: hide)
        let showThumbnails = localStorage.getItem(THUMB_PREF_KEY) === 'true';

        async function init() {
            updateClock();
            setInterval(updateClock, 1000);
            loadCache();
            setupSearch();
            setupThumbToggle();
            setupScrollListener();
            setupInfiniteScroll();
            
            fetchBatch(MASTER_FEEDS.all.slice(0, 8), 'all');
            switchTab('home');
        }

        function setupThumbToggle() {
            const toggle = document.getElementById('thumb-toggle');
            toggle.checked = showThumbnails;
            toggle.onchange = (e) => {
                showThumbnails = e.target.checked;
                localStorage.setItem(THUMB_PREF_KEY, showThumbnails);
                renderTab(currentTab);
            };
        }

        function loadCache() {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
                allNews = JSON.parse(cached);
                updateCountDisplay();
            }
        }

        function saveCache() {
            localStorage.setItem(CACHE_KEY, JSON.stringify(allNews.slice(0, 300)));
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').innerText = now.toLocaleTimeString('en-GB');
            document.getElementById('current-date').innerText = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
        }

        async function fetchBatch(feedUrls, category) {
            if (isBatchLoading) return;
            isBatchLoading = true;
            
            const promises = feedUrls.map(url => 
                fetch(RSS_PROXY + encodeURIComponent(url))
                .then(r => r.json())
                .then(json => json.status === 'ok' ? json.items.map(i => cleanItem(i, url, category)) : [])
                .catch(() => [])
            );

            const results = await Promise.all(promises);
            const freshItems = results.flat();
            
            const existingLinks = new Set(allNews.map(n => n.link));
            const unique = freshItems.filter(i => !existingLinks.has(i.link));
            
            if (unique.length > 0) {
                allNews = [...unique, ...allNews].sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
                saveCache();
                updateCountDisplay();
                renderTab(currentTab);
            }
            isBatchLoading = false;
        }

        function cleanItem(item, url, category) {
            let thumb = item.thumbnail || item.enclosure?.link;
            if (!thumb) {
                const combined = (item.content || "") + (item.description || "");
                const match = combined.match(/<img[^>]+src="([^"]+)"/);
                if (match && match[1]) thumb = match[1];
            }
            if (!thumb || thumb.includes('avatar') || thumb.length < 10) {
                thumb = `https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=600&q=80`;
            }

            const sourceName = url.replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0].split('.')[0].toUpperCase();
            
            return {
                title: item.title,
                link: item.link,
                pubDate: item.pubDate,
                source: sourceName,
                category: category,
                thumb: thumb,
                desc: (item.description || "").replace(/<[^>]*>/g, '').substring(0, 100).trim() + '...'
            };
        }

        function formatPubDate(dateStr) {
            const pub = new Date(dateStr);
            const now = new Date();
            const diffMin = Math.floor((now - pub) / 60000);
            const diffHrs = Math.floor(diffMin / 60);
            if (diffMin < 60) return `${Math.max(1, diffMin)}m ago`;
            if (diffHrs < 24) return `${diffHrs}h ago`;
            return pub.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        function updateCountDisplay() {
            document.getElementById('header-count').innerText = `${allNews.length} News`;
        }

        function setCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.category-pill').forEach(el => el.classList.remove('active'));
            document.getElementById(`cat-${cat}`).classList.add('active');
            itemsToShow = 10;
            const sample = MASTER_FEEDS[cat].sort(() => 0.5 - Math.random()).slice(0, 5);
            fetchBatch(sample, cat);
            renderTab('home');
            scrollToTop();
        }

        function switchTab(tab) {
            currentTab = tab;
            itemsToShow = 10;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            if (document.getElementById(`nav-${tab}`)) document.getElementById(`nav-${tab}`).classList.add('active');
            
            document.getElementById('category-bar').style.display = tab === 'home' ? 'flex' : 'none';
            document.getElementById('thumb-toggle-area').style.display = tab === 'home' ? 'flex' : 'none';
            document.getElementById('app-header').style.display = tab === 'reels' ? 'none' : 'flex';
            
            renderTab(tab);
            scrollToTop();
        }

        function renderTab(tab) {
            const container = document.getElementById('content-area');
            let data = allNews;

            if (activeCategory !== 'all' && tab === 'home') data = data.filter(i => i.category === activeCategory);
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                data = data.filter(i => i.title.toLowerCase().includes(q) || i.source.toLowerCase().includes(q));
            }

            switch(tab) {
                case 'home':
                    container.innerHTML = `
                        <div class="p-4">
                            <h2 class="text-xl font-black text-slate-900 mb-6 flex items-center gap-2">
                                <span class="w-1.5 h-6 bg-rose-600 rounded-full"></span>
                                ${activeCategory === 'all' ? 'Latest Feed' : activeCategory.charAt(0).toUpperCase() + activeCategory.slice(1)}
                            </h2>
                            <div class="space-y-6">
                                ${data.length > 0 ? data.slice(0, itemsToShow).map(item => newsCard(item)).join('') : 
                                  `<div class="py-20 text-center"><div class="spinner mx-auto mb-4"></div><p class="text-slate-400 font-bold uppercase text-[10px] tracking-widest">Refreshing News...</p></div>`}
                            </div>
                        </div>
                    `;
                    break;
                case 'reels':
                    container.innerHTML = `<div class="reels-container">${allNews.filter(n => !n.thumb.includes('unsplash')).slice(0, 15).map(item => reelCard(item)).join('')}</div>`;
                    break;
                case 'sources':
                    const uniqueSources = Array.from(new Set(Object.values(MASTER_FEEDS).flat().map(url => url.replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0].split('.')[0].toUpperCase()))).sort();
                    container.innerHTML = `<div class="p-5"><h2 class="text-xl font-black mb-6 flex items-center gap-2"><span class="w-1.5 h-6 bg-rose-600 rounded-full"></span>Verified Sources</h2><div class="grid grid-cols-2 gap-4">${uniqueSources.map(source => `<div class="source-grid-item animate-in border border-slate-100 shadow-sm"><div class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center mb-3 border border-slate-50"><span class="text-rose-600 font-black text-xl">${source.charAt(0)}</span></div><span class="text-[10px] font-black text-slate-800 uppercase tracking-tighter">${source}</span></div>`).join('')}</div></div>`;
                    break;
                case 'notifications':
                    container.innerHTML = `<div class="p-5"><h2 class="text-xl font-black mb-6 flex items-center gap-2"><span class="w-1.5 h-6 bg-rose-600 rounded-full"></span>Breaking Alerts</h2><div class="space-y-4">${allNews.slice(0, 15).map(item => `<div class="flex gap-4 p-4 bg-rose-50/40 rounded-2xl border border-rose-100/50 animate-in"><div class="shrink-0 w-2 h-2 mt-2 bg-rose-600 rounded-full shadow-[0_0_8px_rgba(225,29,72,0.6)]"></div><div class="flex-1"><p class="text-[9px] font-black text-rose-600 uppercase mb-1 tracking-widest">${item.source} • ${formatPubDate(item.pubDate)}</p><h3 class="font-bold text-[13px] text-slate-900 leading-tight">${item.title}</h3></div></div>`).join('')}</div></div>`;
                    break;
            }
        }

        function newsCard(item) {
            const thumbHtml = showThumbnails ? `
                <div class="relative h-56">
                    <img src="${item.thumb}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=600&q=80'">
                    <div class="absolute top-5 left-5 px-3 py-1.5 bg-white/95 backdrop-blur rounded-full text-[9px] font-black uppercase tracking-widest text-rose-600 shadow-sm border border-slate-100">
                        ${item.source}
                    </div>
                </div>` : '';

            return `
                <div class="bg-white rounded-[2rem] overflow-hidden border border-slate-100 shadow-sm animate-in">
                    ${thumbHtml}
                    <div class="p-6">
                        <div class="flex items-center gap-2 mb-3">
                            ${!showThumbnails ? `<span class="px-2 py-0.5 bg-slate-100 rounded text-[8px] font-black uppercase text-rose-600">${item.source}</span>` : ''}
                            <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">${formatPubDate(item.pubDate)}</span>
                            <span class="w-1 h-1 bg-slate-200 rounded-full"></span>
                            <span class="text-[9px] font-black text-rose-500 uppercase tracking-widest">${item.category}</span>
                        </div>
                        <h3 class="text-[16px] font-extrabold text-slate-900 mb-3 leading-tight line-clamp-2">${item.title}</h3>
                        <p class="text-[12px] text-slate-500 font-medium mb-5 line-clamp-2 leading-relaxed">${item.desc}</p>
                        <button onclick="window.open('${item.link}', '_blank')" class="w-full text-[10px] font-black bg-slate-900 text-white py-3 rounded-xl flex items-center justify-center gap-2 uppercase tracking-[0.15em] transition-all active:scale-95">
                            Read Full Article
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7-7 7"/></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        function reelCard(item) {
            return `
                <div class="reel-card">
                    <img src="${item.thumb}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-b from-black/20 via-transparent to-black/95"></div>
                    <div class="absolute bottom-16 left-0 right-0 p-8 text-white">
                        <div class="flex items-center gap-2 mb-4">
                           <div class="w-8 h-8 rounded-xl bg-rose-600 flex items-center justify-center text-[11px] font-black shadow-lg">${item.source.charAt(0)}</div>
                           <p class="text-[10px] font-black uppercase tracking-widest">${item.source} • ${formatPubDate(item.pubDate)}</p>
                        </div>
                        <h2 class="text-2xl font-black leading-tight mb-8">${item.title}</h2>
                        <button onclick="window.open('${item.link}', '_blank')" class="bg-white text-black px-10 py-4 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] active:scale-90 transition-transform">View Full News</button>
                    </div>
                </div>
            `;
        }

        function setupSearch() {
            const toggle = document.getElementById('search-toggle');
            const container = document.getElementById('search-container');
            const input = document.getElementById('search-input');
            const brand = document.getElementById('brand-area');
            const thumbArea = document.getElementById('thumb-toggle-area');

            toggle.onclick = () => {
                const isHidden = container.classList.contains('hidden');
                if (isHidden) {
                    container.classList.remove('hidden');
                    brand.classList.add('hidden');
                    thumbArea.classList.add('hidden');
                    input.focus();
                } else {
                    container.classList.add('hidden');
                    brand.classList.remove('hidden');
                    thumbArea.classList.remove('hidden');
                    input.value = "";
                    searchQuery = "";
                    renderTab(currentTab);
                }
            };

            input.oninput = (e) => {
                searchQuery = e.target.value;
                itemsToShow = 10;
                renderTab(currentTab);
            };
        }

        function setupScrollListener() {
            window.onscroll = () => {
                const btt = document.getElementById('back-to-top');
                if (window.scrollY > 600 && currentTab === 'home') btt.style.display = 'flex';
                else btt.style.display = 'none';
            };
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setupInfiniteScroll() {
            const obs = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && !isBatchLoading && currentTab === 'home') {
                    itemsToShow += 10;
                    renderTab(currentTab);
                }
            }, { threshold: 0.1 });
            obs.observe(document.getElementById('infinite-anchor'));
        }

        window.onload = init;
    </script>
</body>
</html>
