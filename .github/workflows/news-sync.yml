name: Live Nepal News Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: live-news-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and normalize news
        run: python scripts/fetch_news.py

      - name: Build source registry
        run: python scripts/build_sources.py

      - name: Cluster related coverage
        run: python scripts/cluster_news.py

      - name: Publish generated data
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: sync news, sources and story clusters"
          file_pattern: "data/news.json data/feed-health.json data/sources.json data/stories.json"
